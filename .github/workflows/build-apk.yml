name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Đẩy tag v2.x.y sẽ tạo bản release chính thức, không phải pre-release
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub UI

permissions:
  contents: write # Cần quyền ghi để tạo release chứa APK

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ghim runner thay vì ubuntu-latest để không bị đổi hệ điều hành ngoài ý muốn
  # (GitHub sẽ chuyển ubuntu-latest sang Ubuntu 26 từ 19/10/2026).
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      # Các action dưới đây đều dùng Node.js 24, tránh cảnh báo Node 20 bị bỏ.
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Cài đặt JDK 21 (Bắt buộc cho Gradle 9.x và Android Gradle Plugin 9.x)
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # Cài đặt Android SDK kèm đúng platform/build-tools mà app biên dịch.
      # Action tự chấp nhận license nên không cần gọi sdkmanager --licenses thủ công.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "${{ env.ANDROID_PLATFORM }} ${{ env.ANDROID_BUILD_TOOLS }}"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # Bộ nhớ đệm Gradle dùng provider basic (actions/cache), không phụ thuộc dịch vụ ngoài.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      # Cấp quyền thực thi cho file gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Tạo file môi trường .env rỗng để secrets-gradle-plugin không báo lỗi
      - name: Prepare Environment Files
        run: |
          touch .env
          if [ ! -f .env.example ]; then
            touch .env.example
          fi

      # Chạy unit test JVM (hàng đợi, parser, SponsorBlock...) trước khi build APK.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      # Giải mã keystore dùng để ký bản release từ GitHub Actions secrets.
      # Nếu repo không có secrets (ví dụ PR từ fork), bước release sẽ bị bỏ qua
      # thay vì làm fail cả workflow.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Không có signing secrets — bỏ qua bước ký release."
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/puretube-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" > /dev/null

          {
            echo "HAS_SIGNING=true"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}"
          } >> "$GITHUB_ENV"

          echo "Đã nạp keystore ký bản release."

      # Chỉ build release khi có đủ signing secrets.
      - name: Build Release APK
        if: env.HAS_SIGNING == 'true'
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # Đính APK vào GitHub Pre-release thay vì Actions artifact.
      # Release asset KHÔNG tính vào quota Actions artifact (500 MB dùng chung
      # toàn tài khoản GitHub Free) nên tránh được lỗi
      # "Artifact storage quota has been hit".
      # Chỉ chạy trên main (push hoặc workflow_dispatch), không chạy cho PR/tag.
      - name: Publish Pre-release APK
        if: env.HAS_SIGNING == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="pre-release-latest"
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Không tìm thấy APK release để đính kèm." >&2
            exit 1
          fi

          # Đặt tên asset theo số lần chạy để dễ phân biệt các bản build.
          ASSET="PureTube-${{ github.run_number }}.apk"
          cp "$APK_PATH" "$RUNNER_TEMP/$ASSET"

          # Xoá pre-release cũ kèm tag để luôn chỉ có một bản mới nhất.
          gh release delete "$TAG" --yes --cleanup-tag || true

          gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "PureTube pre-release build ${{ github.run_number }}" \
            --notes "APK build tự động từ commit ${{ github.sha }}.

          - Nhánh: \`${{ github.ref_name }}\`
          - Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          echo "Đã đăng pre-release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"

      # Đẩy tag v2.x.y sẽ tạo release chính thức. Ghi chú lấy từ
      # docs/releases/<tag>.md nếu có, ngược lại dùng changelog tự động của GitHub.
      - name: Publish Tagged Release APK
        if: env.HAS_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Không tìm thấy APK release để đính kèm." >&2
            exit 1
          fi

          ASSET="PureTube-$VERSION.apk"
          cp "$APK_PATH" "$RUNNER_TEMP/$ASSET"

          # Chạy lại workflow trên cùng tag sẽ thay release cũ bằng bản mới.
          gh release delete "$TAG" --yes 2>/dev/null || true

          NOTES_FILE="docs/releases/$TAG.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
              --title "PureTube $VERSION" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
              --title "PureTube $VERSION" \
              --generate-notes
          fi

          echo "Đã đăng release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
