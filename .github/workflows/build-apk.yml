name: Build Debug APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Đẩy tag v2.x.y sẽ tạo bản release chính thức, không phải pre-release
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub UI

permissions:
  contents: write # Cần quyền ghi để tạo release chứa APK

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ghim runner thay vì ubuntu-latest để không bị đổi hệ điều hành ngoài ý muốn
  # (GitHub sẽ chuyển ubuntu-latest sang Ubuntu 26 từ 19/10/2026).
  ANDROID_PLATFORM: "platforms;android-36"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      # Các action dưới đây đều dùng Node.js 24, tránh cảnh báo Node 20 bị bỏ.
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Cài đặt JDK 21 (Bắt buộc cho Gradle 9.x và Android Gradle Plugin 9.x)
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # Cài đặt Android SDK kèm đúng platform/build-tools mà app biên dịch.
      # Action tự chấp nhận license nên không cần gọi sdkmanager --licenses thủ công.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "${{ env.ANDROID_PLATFORM }} ${{ env.ANDROID_BUILD_TOOLS }}"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # Bộ nhớ đệm Gradle dùng provider basic (actions/cache), không phụ thuộc dịch vụ ngoài.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      # Cấp quyền thực thi cho file gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Tạo file môi trường .env rỗng và khôi phục debug.keystore có sẵn từ repo
      # để build Debug APK không cần tạo key ký hay khai báo GitHub Secrets.
      - name: Prepare Environment and Debug Keystore
        run: |
          touch .env
          if [ ! -f .env.example ]; then
            touch .env.example
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      # Chạy unit test JVM (hàng đợi, parser, SponsorBlock...) trước khi build APK.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      # Build Debug APK trực tiếp bằng debugConfig mặc định.
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # Đính Debug APK vào GitHub Pre-release thay vì Actions artifact.
      # Release asset KHÔNG tính vào quota Actions artifact (500 MB dùng chung
      # toàn tài khoản GitHub Free).
      # Chạy trên push/workflow_dispatch (không chạy cho PR hoặc tag).
      - name: Publish Pre-release Debug APK
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="pre-release-latest"
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Không tìm thấy Debug APK để đính kèm." >&2
            exit 1
          fi

          # Đặt tên asset theo số lần chạy để dễ phân biệt các bản build.
          ASSET="PureTube-${{ github.run_number }}-debug.apk"
          cp "$APK_PATH" "$RUNNER_TEMP/$ASSET"

          # Xoá pre-release cũ kèm tag để luôn chỉ có một bản mới nhất.
          gh release delete "$TAG" --yes --cleanup-tag || true

          gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "PureTube Debug build ${{ github.run_number }}" \
            --notes "Debug APK build tự động từ commit ${{ github.sha }}.

          - Nhánh: \`${{ github.ref_name }}\`
          - Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          echo "Đã đăng pre-release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"

      # Đẩy tag v2.x.y sẽ tạo release chính thức với bản Debug APK. Ghi chú lấy từ
      # docs/releases/<tag>.md nếu có, ngược lại dùng changelog tự động của GitHub.
      - name: Publish Tagged Release Debug APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Không tìm thấy Debug APK để đính kèm." >&2
            exit 1
          fi

          ASSET="PureTube-$VERSION-debug.apk"
          cp "$APK_PATH" "$RUNNER_TEMP/$ASSET"

          # Chạy lại workflow trên cùng tag sẽ thay release cũ bằng bản mới.
          gh release delete "$TAG" --yes 2>/dev/null || true

          NOTES_FILE="docs/releases/$TAG.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
              --title "PureTube $VERSION (Debug)" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$ASSET" \
              --title "PureTube $VERSION (Debug)" \
              --generate-notes
          fi

          echo "Đã đăng release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
